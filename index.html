<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="impact-site-verification" value="873c12aa-8ca3-4b12-99c9-326badbfba02">
<meta name="description" content="HarryVerse is a creative home for games, landing page services, digital products, stories and creators.">
<meta name="theme-color" content="#f7f1e7">
<title>HarryVerse | One Universe. Many Things to Discover.</title>
<link rel="canonical" href="https://www.harrydigitalverse.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--cream:#f7f1e7;--paper:#fffdf8;--ink:#272720;
--muted:#706d63;--terracotta:#b8543b;--terracotta-dark:#94422f;

--olive:#59664d;--sage:#e3e6d9;--line:#e1d6c7;
--forest:#28372e;--serif:"Playfair Display",Georgia,serif;
--sans:"DM Sans",Arial,sans-serif;
--shadow:0 16px 42px rgba(56,43,29,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65}
a{color:inherit;text-decoration:none}
button{font:inherit}
.container{width:min(1040px,90%);margin:auto}
.eyebrow,.section-label{
margin:0 0 12px;color:var(--terracotta);
font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase
}

/* NAVIGATION */
.site-header{
position:sticky;top:0;z-index:50;background:rgba(255,253,248,.97);
backdrop-filter:blur(12px);border-bottom:1px solid var(--line)
}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{
width:40px;height:40px;display:grid;place-items:center;
border-radius:12px 12px 12px 3px;background:var(--forest);
color:var(--cream);font-size:.95rem;font-weight:800
}
.brand strong{display:block;font-family:var(--serif);font-size:1.08rem;line-height:1.15}
.brand small{display:block;color:var(--muted);font-size:.59rem;letter-spacing:.11em;text-transform:uppercase}
.nav-links{display:flex;align-items:center;gap:16px}
.nav-links a{color:#48473f;font-size:.77rem;font-weight:700;white-space:nowrap}
.nav-links a:hover{color:var(--terracotta)}
.menu-button{display:none;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* TAMBAHAN GAYA KOD KEMAS KINI (IKON & LANGUAGE PICKER) */
.hv-icon-button, .lang-trigger {
background: transparent;
border: none;
padding: 6px;
cursor: pointer;
display: inline-flex;
align-items: center;
justify-content: center;
color: var(--ink);
transition: color 0.2s;
}
.hv-icon-button:hover, .lang-trigger:hover {
color: var(--terracotta);
}
.hv-icon-button svg {
width: 20px;
height: 20px;
}
.hv-cart-button {
display: inline-flex;
align-items: center;
gap: 4px;
position: relative;
color: var(--ink);
padding: 6px;
}
.hv-cart-button:hover {
color: var(--terracotta) !important;
}
.hv-cart-button svg {
width: 20px;
height: 20px;
}
.hv-cart-count {
background: var(--terracotta);
color: white;
font-size: 0.65rem;
font-weight: 700;
min-width: 16px;
height: 16px;
padding: 0 4px;
border-radius: 10px;
display: inline-flex;
align-items: center;
justify-content: center;
position: absolute;
top: -2px;
right: -4px;
}

/* CUSTOM LANGUAGE PICKER DESIGN */
.custom-lang-picker {
position: relative;
display: inline-block;
}
.lang-trigger {
border: 1px solid var(--line);
background: var(--paper);
border-radius: 20px;
padding: 6px 14px;
gap: 6px;
font-size: 0.75rem;
font-weight: 700;
font-family: var(--sans);
}
.lang-trigger svg {
width: 15px;
height: 15px;
color: var(--ink);
}
.arrow-down {
font-size: 0.6rem;
color: var(--muted);
margin-left: 2px;
}
.lang-dropdown {
position: absolute;
top: 105%;
left: 0;
background: var(--paper);
border: 1px solid var(--line);
border-radius: 12px;
box-shadow: var(--shadow);
padding: 6px 0;
margin: 0;
list-style: none;
min-width: 160px;
display: none;
z-index: 100;
}
.lang-dropdown.show {
display: block;
}
.lang-dropdown li a {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 16px;
color: var(--ink) !important;
font-size: 0.8rem !important;
font-weight: 500 !important;
transition: background 0.2s;
width: 100%;
text-align: left;
}
.lang-dropdown li a:hover {
background: var(--cream);
color: var(--terracotta) !important;
}

/* HERO */
.hero{
padding:65px 0 60px;overflow:hidden;
background:linear-gradient(115deg,#f7f1e7 0%,#f4ecdf 55%,#eee4d4 100%)
}
.hero-grid{display:grid;grid-template-columns:1fr .9fr;gap:35px;align-items:center}
.hero h1{
max-width:680px;margin:18px 0;font-family:var(--serif);
font-size:clamp(3.2rem,5vw,5rem);font-weight:600;
letter-spacing:-.055em;line-height:1.02
}
.hero h1 em{color:var(--terracotta);font-weight:500}
.hero-description{max-width:540px;margin-bottom:24px;color:var(--muted);font-size:1.02rem}
.hero-actions{display:flex;flex-wrap:wrap;gap:11px}
.button{
display:inline-flex;align-items:center;justify-content:center;gap:8px;
min-height:46px;padding:11px 17px;border:1px solid transparent;
border-radius:7px;font-size:.84rem;font-weight:800;
transition:transform .2s,background .2s
}
.button:hover{transform:translateY(-2px)}
.button-primary{background:var(--terracotta);color:white}
.button-primary:hover{background:var(--terracotta-dark)}
.button-secondary{border-color:#bdb2a2;background:transparent;color:var(--ink)}
.hero-points{display:grid;gap:5px;margin-top:20px;color:var(--muted);font-size:.79rem}

/* HERO ART - NO FLOATING TEXT BOX */
.hero-art{
position:relative;min-height:360px;display:flex;
align-items:center;justify-content:center;overflow:visible
}
.hero-art-stack{
width:100%;height:300px;display:flex;align-items:center;
justify-content:center;gap:12px;transform:rotate(-3deg)
}
.art-tile{
width:31%;min-height:190px;padding:16px 13px;border-radius:14px;
display:flex;flex-direction:column;justify-content:space-between;
box-shadow:0 18px 36px #382b1d20;border:1px solid #ffffff99
}
.art-tile small{font-size:.6rem;font-weight:800;letter-spacing:.14em}
.art-tile strong{font:600 1.16rem/1.12 var(--serif)}
.tile-icon{font-size:1.65rem}
.art-tile-game{background:#dce8f3;color:#355d83;transform:translateY(25px) rotate(-5deg)}
.art-tile-create{background:#e5e9dc;color:#43523d;transform:translateY(-18px);z-index:1}
.art-tile-story{background:#f2dfd1;color:#985039;transform:translateY(28px) rotate(5deg)}
.hero-art-stamp{
position:absolute;right:2%;bottom:0;width:54px;height:54px;
display:grid;place-items:center;border-radius:50%;
background:var(--forest);color:white;font:700 1.1rem var(--serif);
border:4px solid var(--cream);box-shadow:0 6px 18px #28372e22
}

/* SECTIONS */
.section{padding:68px 0;scroll-margin-top:85px}
.section-alt{background:#f2e9dc}
.section-sage{background:#e8ede3}
.section-heading{
display:flex;justify-content:space-between;align-items:end;
gap:24px;margin:0 auto 27px;max-width:1040px
}
.section-heading h2{
margin:6px 0 0;font:600 clamp(2rem,4vw,3.1rem)/1.1 var(--serif);
letter-spacing:-.04em
}
.section-heading>p{max-width:390px;margin:0;color:var(--muted);font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{
display:flex;flex-direction:column;align-items:flex-start;padding:24px;
border:1px solid var(--line);border-radius:14px;background:var(--paper);
transition:transform .2s,box-shadow .2s
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card-symbol{
width:44px;height:44px;display:grid;place-items:center;margin-bottom:16px;
border-radius:13px;background:var(--sage);font-size:1.25rem
}
.card h3{margin:0 0 8px;font:600 1.35rem/1.2 var(--serif)}
.card p{margin:0;color:var(--muted);font-size:.86rem}
.card .text-link{margin-top:17px;color:var(--terracotta);font-size:.83rem;font-weight:800}
.card-meta{
margin-bottom:8px;color:var(--terracotta);font-size:.66rem;
font-weight:800;letter-spacing:.13em;text-transform:uppercase
}

/* GAMES COLOURS */
.game-feature{
display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;
margin:0 auto 18px;padding:21px 24px;max-width:1040px;
border:1px solid #d7b77d;border-radius:13px;
background:linear-gradient(105deg,#fff8e8,#fffdf8 70%);
box-shadow:0 10px 28px #8a642411
}
.game-feature-copy h3{margin:2px 0 4px;font:600 1.4rem var(--serif)}
.game-feature-copy p{margin:0;color:var(--muted);font-size:.84rem}
.game-feature-copy .card-meta{color:#a66a22}
.game-progress{color:var(--muted);font-size:.75rem}
.game-progress strong{display:block;color:var(--forest);font-size:1.1rem}
#games .game-feature .button-primary{background:#bd6b32}
#games .card:nth-child(1){background:linear-gradient(145deg,#edf3fa,#fffdf8 75%);border-color:#cbd9e8}
#games .card:nth-child(1) .card-symbol{background:#d6e5f4;color:#355d83}
#games .card:nth-child(1) .card-meta{color:#426b91}
#games .card:nth-child(2){background:linear-gradient(145deg,#f8f0d8,#fffdf8 75%);border-color:#e8d9a9}
#games .card:nth-child(2) .card-symbol{background:#f1e2ae;color:#8a6424}
#games .card:nth-child(2) .card-meta{color:#98722d}

/* PORTFOLIO PREVIEWS */
.preview{
min-height:150px;width:100%;margin-bottom:17px;display:flex;
align-items:center;justify-content:center;overflow:hidden;border-radius:9px;background:#e5dfd2
}
.mini-site{
width:85%;min-height:115px;display:grid;grid-template-columns:1fr .7fr;
background:#fffdf8;border:1px solid #dfd3c1;border-radius:5px;overflow:hidden;
box-shadow:0 8px 20px #28372e15
}
.mini-copy{padding:14px;display:flex;flex-direction:column;justify-content:center}
.mini-copy small{color:var(--terracotta);font-size:.48rem;font-weight:800;letter-spacing:.1em}
